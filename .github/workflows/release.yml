name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PY_PYTHON3: "3.13"
  QT_QPA_PLATFORM: offscreen

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          py -3 -X utf8 -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m pip install -r requirements.lock

      - name: Verify release sources
        run: |
          py -3 -X utf8 -m pytest tests/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m mypy

      - name: Verify Chromium integration
        env:
          RUN_WEBENGINE_TESTS: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          py -3 -X utf8 -m pytest tests/test_annotation_bridge.py tests/test_renderer_source_navigation.py tests/test_translate_menus.py tests/test_inline_edit_webengine.py tests/test_table_edit_webengine.py tests/test_pdf_export_webengine.py tests/test_reading_style_webengine.py tests/test_renderer_switching.py tests/test_release_validation.py tests/test_html_loading.py tests/test_diagram_loading_webengine.py tests/test_renderer_page_rotation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m pytest tests/test_wysiwyg_webengine.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m pytest tests/test_office_commands_webengine.py tests/test_paste_preview_webengine.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify deferred code highlighting
        env:
          RUN_WEBENGINE_TESTS: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: py -3 -X utf8 -m pytest tests/test_code_loading_webengine.py

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Sync version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          py -3 -X utf8 tools/bump_version.py $version

      - name: Build installer
        shell: pwsh
        run: |
          py -3 -X utf8 tools/build_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m PyInstaller --noconfirm markdown_viewer.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Write current release notes
        run: >-
          py -3 -X utf8 tools/write_release_notes.py
          --version "${{ github.ref_name }}"
          --output "${{ runner.temp }}/release-notes.md"

      - name: Prepare GitHub release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: installer_output/*.exe
