name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PY_PYTHON3: "3.13"
  QT_QPA_PLATFORM: offscreen

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          py -3 -X utf8 -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m pip install -r requirements.lock

      - name: Verify release sources
        run: |
          py -3 -X utf8 -m pytest tests/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m mypy

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Sync version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          py -3 -X utf8 tools/bump_version.py $version

      - name: Build installer
        shell: pwsh
        run: |
          py -3 -X utf8 tools/build_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m PyInstaller --noconfirm markdown_viewer.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: installer_output/*.exe
