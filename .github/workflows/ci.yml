name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: py -3 -X utf8 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: py -3 -X utf8 -m pytest tests/ --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  webengine:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      RUN_WEBENGINE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: py -3 -X utf8 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run WebEngine integration tests
        run: py -3 -X utf8 -m pytest tests/ -k webengine --junitxml=webengine-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webengine-results
          path: webengine-results.xml
