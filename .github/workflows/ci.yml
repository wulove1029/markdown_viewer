name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_PYTHON3: "3.13"

jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          py -3 -X utf8 -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m pip install -r requirements.lock
      - name: Run tests
        run: py -3 -X utf8 -m pytest tests/ --junitxml=test-results.xml
      - name: Lint
        run: py -3 -X utf8 -m ruff check .
      - name: Type check managed modules
        run: py -3 -X utf8 -m mypy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  webengine:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      RUN_WEBENGINE_TESTS: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          py -3 -X utf8 -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -X utf8 -m pip install -r requirements.lock
      - name: Run WebEngine integration tests
        run: >-
          py -3 -X utf8 -m pytest
          tests/test_annotation_bridge.py tests/test_renderer_source_navigation.py
          tests/test_translate_menus.py tests/test_inline_edit_webengine.py
          tests/test_table_edit_webengine.py tests/test_pdf_export_webengine.py
          tests/test_wysiwyg_webengine.py --junitxml=webengine-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webengine-results
          path: webengine-results.xml
