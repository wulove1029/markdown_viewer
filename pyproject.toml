[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["tmp", "build", "dist", "assets", "docs", ".claude", ".agents", ".codex*", "pytest_run_*", "test_tmp_*", "AI協作"]

[tool.ruff.lint]
select = ["E", "F", "I"]

# Existing formatting debt and pytest fixture imports are baselined per file.
# New files receive every selected rule; remove ignores as each file is cleaned.
[tool.ruff.lint.per-file-ignores]
"app/document_libraries.py" = ["E402"]
"app/document_relocation.py" = ["E501"]
"app/edit_backend.py" = ["E501"]
"app/file_ops.py" = ["E501"]
